name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One in-flight run per workflow per ref. A push that supersedes a still-running run cancels it
# instead of paying for both: measured over 30 days on cogno-host, 1526 of 3016 billed CI minutes
# (51%) went to runs a newer push had already made obsolete.
#
# The key is WORKFLOW + ref, not ref alone. A ref-only group would put this workflow and the
# publish workflow beside it into the SAME group on a push to main, so a release could cancel CI,
# or CI a release. A group is a lane; two workflows that mean different things do not share one.
#
# `main` is EXEMPT from cancellation, deliberately. A push to main is a commit nobody will
# re-push, so cancelling its run leaves that commit with no verdict at all — and main is the ref
# a release tag is cut from. On main the group still SERIALISES (a second run queues behind the
# first) rather than cancelling: the waste this exists to stop is iterating on a PR, not merging,
# and merges are already serialised by review. On a pull_request event github.ref is
# refs/pull/<n>/merge, never refs/heads/main, so PR runs always cancel — which is where the 51%
# is. The cost of the exemption is therefore close to zero and it buys back a per-commit verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          # Named so the destructive-suite guard lets it through: the DROP TABLE
          # suite refuses any database whose name does not say "test".
          POSTGRES_DB: cogno_praxis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # The integration test drives the server through cogno-mcp (→ cogno-anima).
          # Those cogno libs are not on PyPI yet — install the chain from git.
          pip install "cogno-homeo @ git+https://github.com/sudoers-ai/cogno-homeo.git"
          pip install "cogno-synapse @ git+https://github.com/sudoers-ai/cogno-synapse.git"
          pip install "cogno-anima @ git+https://github.com/sudoers-ai/cogno-anima.git"
          pip install "cogno-mcp @ git+https://github.com/sudoers-ai/cogno-mcp.git"
          # The coordinator's calendar export mails its .ics through cogno-herald (optional at
          # runtime, lazily imported). Installed here so the delivery adapter's tests RUN
          # instead of skipping — a skipped adapter is an adapter nobody measured.
          pip install "cogno-herald @ git+https://github.com/sudoers-ai/cogno-herald.git"
      - name: Lint (ruff)
        run: ruff check cogno_praxis tests examples
      - name: Type-check (mypy)
        run: mypy cogno_praxis
      # ONE step, and it names no CHILD of `tests/`. Naming them by name is how a suite
      # goes missing: `tests/test_closer_prompts.py` sat at the root of `tests/` until #90,
      # merged and reviewed and collected by nothing, and the day someone adds a third
      # child directory the same thing happens again with this workflow still green.
      # `tests` is an ancestor of every test file, so nothing can fall out of it;
      # `tests/unit/test_ci_runs_every_test_file.py` is the assertion that keeps it that way.
      # The `|| [ $? -eq 5 ]` the integration step used to carry is gone with the split: it
      # allowed pytest's "no tests collected" exit code, which a run over the whole tree
      # cannot produce.
      - name: Tests (unit + integration — scheduler/bookkeeper over stdio via cogno-mcp; + Postgres)
        env:
          COGNO_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/cogno_praxis_test
        run: pytest tests -q --cov=cogno_praxis --cov-report=term-missing --cov-fail-under=90
